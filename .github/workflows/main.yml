name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 1 检出代码
        uses: actions/checkout@v4

      - name: 2 环境自检
        run: |
          set -e
          sw_vers
          xcodebuild -version
          echo "---- 仓库根目录 ----"
          ls -la

      - name: 3 定位 6.7.2 源码（只认这一个，绝不编错版本）
        id: locate
        run: |
          set -eu
          WANT="LSPakManager-Source-v6.7.2"
          ROOT=""

          # A. 仓库根目录直接就是工程
          if [ -f "project.yml" ] && [ -d "Sources" ]; then
            V=$(grep -o 'CFBundleShortVersionString: *"[0-9.]*"' project.yml | head -n1 | sed 's/.*"\([0-9.]*\)"/\1/')
            if [ "$V" = "6.7.2" ]; then ROOT="."; fi
          fi

          # B. 已经解开的文件夹
          if [ -z "$ROOT" ]; then
            for d in "$WANT" "./$WANT"; do
              if [ -z "$ROOT" ] && [ -f "$d/project.yml" ]; then ROOT="$d"; fi
            done
          fi

          # C. 压缩包：一个个试，只认版本号 = 6.7.2 的那个
          if [ -z "$ROOT" ]; then
            for f in $(find . -maxdepth 2 -type f -name "*.zip" -not -path "./.git/*" 2>/dev/null); do
              [ -z "$ROOT" ] || break
              echo "---- 试压缩包：$f ----"
              rm -rf _src && mkdir -p _src
              python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$f" _src 2>/dev/null \
                || unzip -oq "$f" -d _src 2>/dev/null || true
              P=$(find _src -maxdepth 3 -name project.yml | head -n1 || true)
              if [ -n "${P:-}" ]; then
                VV=$(grep -o 'CFBundleShortVersionString: *"[0-9.]*"' "$P" | head -n1 | sed 's/.*"\([0-9.]*\)"/\1/')
                echo "   里面的版本 = ${VV:-?}"
                if [ "$VV" = "6.7.2" ]; then ROOT=$(dirname "$P"); fi
              fi
            done
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::没找到 6.7.2 的源码。把 LSPakManager-Source-v6.7.2.zip 原样传到仓库根目录，别解压、别改名，再点一次 Run workflow。"
            ls -la
            exit 1
          fi

          V=$(grep -o 'CFBundleShortVersionString: *"[0-9.]*"' "$ROOT/project.yml" | head -n1 | sed 's/.*"\([0-9.]*\)"/\1/')
          echo "工程目录 = $ROOT"
          echo "版本 = $V"
          if [ "$V" != "6.7.2" ]; then
            echo "::error::挑中的源码版本是 $V，不是 6.7.2。请确认传的是 LSPakManager-Source-v6.7.2.zip。"
            exit 1
          fi

          echo "---- 这次要编的 Swift 文件 ----"
          ls -1 "$ROOT/Sources"/*.swift
          echo "---- 内核库 ----"
          ls -l "$ROOT/Sources/Libs"

          # 功能自检：确认这版的两处改动真的在源码里
          grep -q "listImportSources" "$ROOT/Sources/LSPaths.swift" || { echo "::error::LSPaths.swift 里没有 listImportSources"; exit 1; }
          grep -q "importedDir().path" "$ROOT/Sources/LSPaths.swift" || { echo "::error::导入源没有包含 App 库（源码是旧的）"; exit 1; }
          grep -q "parkSource" "$ROOT/Sources/AutoIO.swift" || { echo "::error::AutoIO.swift 里没有 parkSource（源码是旧的）"; exit 1; }
          grep -q "已在App库里" "$ROOT/Sources/AutoIO.swift" || { echo "::error::AutoIO.swift 里没有库文件保护（源码是旧的）"; exit 1; }
          grep -q "UIDocumentPickerDelegate" "$ROOT/Sources/DocPicker.swift" || { echo "::error::没找到新文件面板 DocPicker.swift（源码不全）"; exit 1; }
          grep -q "silentAdopt" "$ROOT/Sources/StoreImport.swift" || { echo "::error::StoreImport.swift 里没有自动对账"; exit 1; }
          grep -q "askDeleteImports" "$ROOT/Sources/StoreImport.swift" || { echo "::error::StoreImport.swift 里没有一步直删"; exit 1; }
          grep -q "导入成功" "$ROOT/Sources/Store.swift" || { echo "::error::没有导入成功弹窗"; exit 1; }
          grep -q "alertNeedsConfirm" "$ROOT/Sources/Store.swift" || { echo "::error::Store.swift 里没有弹窗状态"; exit 1; }
          if grep -q "adoptParked" "$ROOT/Sources/ContentView.swift"; then echo "::error::ContentView 里还留着「认领」按钮（源码是旧的）"; exit 1; fi
          if grep -q "fileImporter" "$ROOT/Sources/ContentView.swift"; then echo "::error::ContentView 里还在用 SwiftUI 自带文件面板（源码是旧的）"; exit 1; fi
          # 墨绿 HUD 外观 + 动态粒子自检
          [ -f "$ROOT/Sources/Mecha.swift" ] || { echo "::error::缺少 Mecha.swift（外观层没打进包）"; exit 1; }
          [ -f "$ROOT/Sources/LiveFX.swift" ] || { echo "::error::缺少 LiveFX.swift（粒子特效层没打进包）"; exit 1; }
          grep -q "TimelineView" "$ROOT/Sources/LiveFX.swift" || { echo "::error::LiveFX.swift 里没有动画驱动"; exit 1; }
          grep -q "Canvas" "$ROOT/Sources/LiveFX.swift" || { echo "::error::LiveFX.swift 里没有粒子绘制"; exit 1; }
          grep -q "LiveFX" "$ROOT/Sources/Appearance.swift" || { echo "::error::Appearance.swift 没接上粒子层"; exit 1; }
          grep -q "KenBurnsImage" "$ROOT/Sources/Appearance.swift" || { echo "::error::自定义背景没有动态效果"; exit 1; }
          grep -q "MechaHUD" "$ROOT/Sources/Appearance.swift" || { echo "::error::Appearance.swift 里没有 HUD 背景层"; exit 1; }
          grep -q "墨绿机甲" "$ROOT/Sources/Appearance.swift" || { echo "::error::没有「墨绿机甲」主题（源码是旧的）"; exit 1; }
          grep -q "② 修复" "$ROOT/Sources/ContentView.swift" || { echo "::error::按钮文字没改成「② 修复」（源码是旧的）"; exit 1; }
          grep -qF '点一下修复（' "$ROOT/Sources/ContentView.swift" || { echo "::error::② 按钮下面的说明不是「点一下修复（N 个）」（源码是旧的）"; exit 1; }
          if grep -q "点一下直接修" "$ROOT/Sources/ContentView.swift"; then echo "::error::还留着「点一下直接修」旧文案"; exit 1; fi
          if grep -q "点一下直接删" "$ROOT/Sources/ContentView.swift"; then echo "::error::还留着「点一下直接删」旧文案"; exit 1; fi
          grep -q "修复成功" "$ROOT/Sources/StoreImport.swift" || { echo "::error::没有「修复成功」弹窗（源码是旧的）"; exit 1; }
          if grep -q "删除成功" "$ROOT/Sources/StoreImport.swift"; then echo "::error::还留着「删除成功」字样（源码是旧的）"; exit 1; fi
          grep -q "Mecha.amber" "$ROOT/Sources/ContentView.swift" || { echo "::error::橙金描边没接上"; exit 1; }
          grep -q "mechaPanel" "$ROOT/Sources/ContentView.swift" || { echo "::error::ContentView 没换成机甲面板"; exit 1; }
          grep -q "ChamferedRect" "$ROOT/Sources/ContentView.swift" || { echo "::error::切角装甲没接上"; exit 1; }
          # 布局退回自检：不许再有多出来的一行 / 字号不许改
          if grep -q "数据目录" "$ROOT/Sources/ContentView.swift"; then echo "::error::状态卡里多了「数据目录」一行，布局被撑变了（应该和 6.6.3 一模一样的排版）"; exit 1; fi
          grep -qF 'size: 13, weight: .bold' "$ROOT/Sources/ContentView.swift" || { echo "::error::按钮字号被改过，布局应该和 6.6.3 完全一致"; exit 1; }
          grep -qF 'minimumScaleFactor(0.65)' "$ROOT/Sources/ContentView.swift" || { echo "::error::按钮缩放参数被改过，布局应该和 6.6.3 完全一致"; exit 1; }
          grep -qF 'GridItem(.flexible(), spacing: 9)' "$ROOT/Sources/ContentView.swift" || { echo "::error::四宫格排列被改过，布局应该和 6.6.3 完全一致"; exit 1; }
          ICON="$ROOT/Sources/Assets.xcassets/AppIcon.appiconset/icon_1024.png"
          [ -f "$ICON" ] || { echo "::error::图标文件不见了"; exit 1; }
          ISIZE=$(stat -f%z "$ICON")
          [ "$ISIZE" -gt 100000 ] || { echo "::error::图标文件太小（$ISIZE 字节），可能没换成功"; exit 1; }
          echo "外观自检通过 ✅（墨绿 HUD + 粒子动态背景 + 新图标 $ISIZE 字节）"
          echo "功能自检通过 ✅（新文件面板 + 一步直删 + 三个弹窗都在，② 与弹窗文案已改「修复」）"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## 本次构建"
            echo ""
            echo "- 版本：**$V**"
            echo "- 目录：\`$ROOT\`"
            echo ""
            echo "下面出现「ipa 直链」才算编好。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 4 准备 XcodeGen
        run: |
          set -eu
          if command -v xcodegen >/dev/null 2>&1; then
            echo "系统自带 xcodegen: $(xcodegen --version)"; exit 0
          fi
          mkdir -p "$HOME/xg"
          curl -L --fail --retry 3 -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q -o /tmp/xg.zip -d "$HOME/xg"
          BIN=$(find "$HOME/xg" -type f -name xcodegen -perm -u+x | head -n1 || true)
          [ -z "$BIN" ] && BIN=$(find "$HOME/xg" -type f -name xcodegen | head -n1 || true)
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          echo "装好了: $("$BIN" --version)"

      - name: 5 生成 Xcode 工程
        env:
          SRC_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -eu
          cd "$SRC_ROOT"
          xcodegen generate
          ls -la
          xcodebuild -list -project LSPakManager.xcodeproj

      - name: 6 编译
        env:
          SRC_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          cd "$SRC_ROOT"
          set +e
          xcodebuild \
            -project LSPakManager.xcodeproj \
            -scheme LSPakManager \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build > /tmp/build.log 2>&1
          RC=$?
          echo "xcodebuild 退出码 = $RC"
          echo "================ 报错行 ================"
          grep -nE "error:|fatal error|BUILD FAILED|undefined symbol|ld: " /tmp/build.log | head -60 || echo "（没匹配到 error: 行）"
          echo "================ 日志最后 30 行 ================"
          tail -n 30 /tmp/build.log || true
          exit $RC

      - name: 7 打包成 ipa
        id: pack
        env:
          SRC_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -eu
          cd "$SRC_ROOT"
          APP=$(find build/Build/Products -maxdepth 3 -type d -name "*.app" | head -n1 || true)
          echo "APP = [$APP]"
          [ -z "$APP" ] && { echo "::error::没找到 .app"; exit 1; }
          APPNAME=$(basename "$APP")
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || true)
          [ -n "${EXEC:-}" ] || EXEC="${APPNAME%.app}"
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" 2>/dev/null || echo "?")
          echo "APPNAME=[$APPNAME] EXEC=[$EXEC] 版本=[$VER]"
          if [ "$VER" != "6.7.2" ]; then
            echo "::error::打出来的包版本是 $VER，不是 6.7.2"
            exit 1
          fi

          rm -rf Payload LSPakManager-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" "Payload/$APPNAME"

          lipo -info "Payload/$APPNAME/$EXEC" 2>/dev/null || file "Payload/$APPNAME/$EXEC"

          if zip -qry LSPakManager-unsigned.ipa Payload; then
            echo "打包方式：zip ✅"
          else
            rm -f LSPakManager-unsigned.ipa
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload LSPakManager-unsigned.ipa
            echo "打包方式：ditto ✅"
          fi

          ls -l LSPakManager-unsigned.ipa
          SIZE=$(stat -f%z LSPakManager-unsigned.ipa)
          [ "$SIZE" -lt 1000000 ] && { echo "::error::ipa 只有 $SIZE 字节，打包没成"; exit 1; }

          unzip -t LSPakManager-unsigned.ipa | tail -n 4

          LISTING=$(unzip -l LSPakManager-unsigned.ipa)
          printf '%s\n' "$LISTING" | grep -q "Payload/$APPNAME/$EXEC" || { echo "::error::ipa 里没有主程序"; exit 1; }
          printf '%s\n' "$LISTING" | grep -q "libxpf.dylib" || { echo "::error::ipa 里没有 libxpf.dylib"; exit 1; }
          printf '%s\n' "$LISTING" | grep -q "libgrabkernel2.dylib" || { echo "::error::ipa 里没有 libgrabkernel2.dylib"; exit 1; }
          echo "结构校验通过：主程序 + 两个内核库齐全 ✅"

          SHA=$(shasum -a 256 LSPakManager-unsigned.ipa | awk '{print $1}')
          echo "SHA256 = $SHA"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "appname=$APPNAME" >> "$GITHUB_OUTPUT"

      - name: 8 上传产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: LSPakManager-ipa
          path: ${{ steps.locate.outputs.root }}/LSPakManager-unsigned.ipa
          retention-days: 30

      - name: 9 发成直链
        id: rel
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-latest
          name: 最新 ipa（自动构建）
          body: |
            构建号：${{ github.run_number }}
            版本：6.7.2
            大小：${{ steps.pack.outputs.size }} 字节
            SHA256：${{ steps.pack.outputs.sha }}

            未签名包：导入全能签后勾「重签所有框架」，别勾「修改 bundle id」。
          files: ${{ steps.locate.outputs.root }}/LSPakManager-unsigned.ipa
          overwrite_files: true
          make_latest: true

      - name: 10 运行页写出下载地址
        if: success()
        run: |
          set +e
          URL="https://github.com/${{ github.repository }}/releases/download/ipa-latest/LSPakManager-unsigned.ipa"
          {
            echo "## ✅ ipa 直链（点开直接下）"
            echo ""
            echo "$URL"
            echo ""
            echo "- 版本：**6.7.2**"
            echo "- 大小：${{ steps.pack.outputs.size }} 字节"
            echo "- SHA256：\`${{ steps.pack.outputs.sha }}\`"
            echo ""
            echo "## 📦 Artifacts 备用（是 zip，要解压）"
            echo ""
            echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ipa 直链 = $URL"

      - name: 11 失败时把错误原文写回仓库
        if: failure()
        run: |
          set +e
          {
            echo "# 这次构建没成功"
            echo ""
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            if [ -f /tmp/build.log ]; then
              grep -nE "error:|fatal error|BUILD FAILED|undefined symbol|ld: " /tmp/build.log | head -120
              echo "---- 最后 80 行 ----"
              tail -n 80 /tmp/build.log
            else
              echo "没走到编译这一步，往上翻「3 定位 6.7.2 源码」那一步的输出。"
            fi
            echo '```'
          } > BUILD-ERROR.txt
          sed -n '1,30p' BUILD-ERROR.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -f BUILD-ERROR.txt
          git commit -m "记录编译错误 [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::写回仓库失败，不影响别的步骤"
