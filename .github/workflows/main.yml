name: Build IPA v15

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 1 检出代码
        uses: actions/checkout@v4

      - name: 2 环境自检
        run: |
          set -e
          sw_vers
          xcodebuild -version
          echo "---- 仓库内容 ----"
          ls -la

      - name: 3 找 v15 源码
        id: locate
        run: |
          set -eu

          echo "==== 只认 v15，别的一概不碰 ===="

          BEST=""

          # A. 压缩包，按版本从高到低挑 —— 优先于文件夹，免得旧文件夹抢戏
          if [ -z "$BEST" ]; then
            ZIPS=$(ls -1 *.zip 2>/dev/null | grep -iE 'v15\.[0-9]+' | sort -rV || true)
            for z in $ZIPS; do
              [ -f "$z" ] || continue
              echo "---- 试探压缩包：$z ----"
              rm -rf _v15src && mkdir -p _v15src
              if python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$z" _v15src 2>/dev/null; then
                echo "解压方式：python zipfile ✅"
              else
                unzip -oq "$z" -d _v15src || { echo "跳过（不是有效压缩包）"; rm -rf _v15src; continue; }
                echo "解压方式：unzip ✅"
              fi
              P=$(find _v15src -maxdepth 5 -name project.yml | head -n 1 || true)
              [ -z "${P:-}" ] && { echo "跳过（里面没有工程）"; rm -rf _v15src; continue; }
              D=$(dirname "$P")
              if grep -q 'CFBundleShortVersionString: "15\.' "$D/project.yml"; then
                BEST="$D"; echo "命中压缩包：$z → $D"; break
              else
                echo "跳过（版本不是 15.x）"
                rm -rf _v15src
              fi
            done
          fi

          # B. 已经解开的文件夹（只在没有更高版本压缩包时才用）
          if [ -z "$BEST" ]; then
            DIRS=$(ls -1d LSPakManager-Source-v15*/ 2>/dev/null | sed 's:/$::' | sort -rV || true)
            for d in $DIRS . ; do
              if [ -f "$d/project.yml" ] && [ -d "$d/Sources" ]; then
                if grep -q 'CFBundleShortVersionString: "15\.' "$d/project.yml"; then
                  BEST="$d"; echo "命中文件夹：$d"; break
                fi
              fi
            done
          fi

          if [ -z "$BEST" ]; then
            echo "::error::仓库里没找到 v15 源码"
            echo "---- 仓库里的 zip ----"
            ls -la *.zip 2>/dev/null || true
            {
              echo "## ⛔ 没找到 v15 源码"
              echo ""
              echo "把 \`LSPakManager-Source-v15.3.zip\` 原样传到仓库根目录（别解压、别改名），再点 Run workflow。仓库里有多个 v15 包时，自动挑版本最高的那个。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "======================================"
          echo "选中源码 = $BEST"
          echo "---- Swift 文件 ----"
          ls -la "$BEST/Sources"
          echo "======================================"
          echo "root=$BEST" >> "$GITHUB_OUTPUT"
          {
            echo "## 🔎 本次源码"
            echo ""
            echo "- 版本：**15.3**"
            echo "- 目录：\`$BEST\`"
            echo ""
            echo "下面出现「✅ ipa 直链」才说明编译成功。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 4 准备 XcodeGen
        run: |
          set -eu
          if command -v xcodegen >/dev/null 2>&1; then
            echo "系统自带: $(xcodegen --version)"
            exit 0
          fi
          mkdir -p "$HOME/xg"
          curl -L --fail --retry 3 -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q -o /tmp/xg.zip -d "$HOME/xg"
          BIN=$(find "$HOME/xg" -type f -name xcodegen -perm -u+x | head -n 1 || true)
          [ -z "$BIN" ] && BIN=$(find "$HOME/xg" -type f -name xcodegen | head -n 1 || true)
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          echo "装好了: $("$BIN" --version)"

      - name: 5 生成工程 + 源码自检
        env:
          SRC_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -eu
          cd "$SRC_ROOT"

          echo "---- 这版该有的文件 ----"
          for f in Sources/LSApp.swift Sources/ContentView.swift Sources/Store.swift \
                   Sources/FilzaBridge.swift Sources/LSPaths.swift Sources/Models.swift \
                   Sources/DirPicker.swift Sources/Appearance.swift Sources/Compatibility.swift ; do
            [ -f "$f" ] || { echo "::error::缺 $f，源码包不完整"; exit 1; }
          done
          echo "文件齐 ✅"

          echo "---- 桥接层：必须真的走 http 桥 ----"
          grep -q "PROPFIND" Sources/FilzaBridge.swift || { echo "::error::FilzaBridge 里没有 WebDAV 列目录"; exit 1; }
          grep -q "func upload" Sources/FilzaBridge.swift || { echo "::error::FilzaBridge 里没有上传"; exit 1; }
          grep -q "func download" Sources/FilzaBridge.swift || { echo "::error::FilzaBridge 里没有下载"; exit 1; }
          grep -q "func move" Sources/FilzaBridge.swift || { echo "::error::FilzaBridge 里没有移动"; exit 1; }
          grep -q "func ensureDir" Sources/FilzaBridge.swift || { echo "::error::FilzaBridge 里没有建目录"; exit 1; }
          grep -q "Containers/Data/Application" Sources/FilzaBridge.swift || { echo "::error::没有扫 App 容器；找不到游戏目录"; exit 1; }
          grep -q "ShadowTrackerExtra" Sources/FilzaBridge.swift || { echo "::error::认游戏目录的特征串丢了"; exit 1; }
          echo "http 桥 ✅"

          echo "---- 一个中转站：手动导入 / 手动移出 ----"
          grep -q "func importAll" Sources/Store.swift || { echo "::error::没有「导入文件」的 importAll"; exit 1; }
          grep -q "func overwriteInto" Sources/Store.swift || { echo "::error::没有覆盖写入的 overwriteInto"; exit 1; }
          grep -q "func exportImported" Sources/Store.swift || { echo "::error::没有「移出导入的文件」的 exportImported"; exit 1; }
          grep -q "func pull" Sources/Store.swift || { echo "::error::没有把包搬回中转站的 pull"; exit 1; }
          grep -q "transitPath" Sources/Store.swift || { echo "::error::没有中转站路径"; exit 1; }
          if grep -q "startPilot\|func scanTransit\|autoPullAfter" Sources/Store.swift; then echo "::error::自动巡逻还在（拿到的是旧包）"; exit 1; fi
          grep -q "store.importAll()" Sources/ContentView.swift || { echo "::error::界面「导入文件」没接 importAll()（拿到的是旧包）"; exit 1; }
          grep -q "导入文件" Sources/ContentView.swift || { echo "::error::界面没有「导入文件」按钮（拿到的是旧包）"; exit 1; }
          grep -q "store.exportImported()" Sources/ContentView.swift || { echo "::error::界面「移出导入的文件」没接 exportImported()（拿到的是旧包）"; exit 1; }
          grep -q "移出导入的文件" Sources/ContentView.swift || { echo "::error::界面没有「移出导入的文件」（拿到的是旧包）"; exit 1; }
          if grep -q "store.autoOn" Sources/ContentView.swift; then echo "::error::自动搬运开关还在（拿到的是旧包）"; exit 1; fi
          grep -q "中转站" Sources/ContentView.swift || { echo "::error::界面没有中转站那一块"; exit 1; }
          grep -q "DirPicker" Sources/ContentView.swift || { echo "::error::没有文件夹选择器"; exit 1; }
          grep -q "struct DirPicker" Sources/DirPicker.swift || { echo "::error::DirPicker.swift 里没有选择器"; exit 1; }
          echo "中转站 + 手动导入 / 手动移出 ✅"

          echo "---- 这版不许再出现改包 / 内核 ----"
          if [ -f Sources/PakEngine.swift ]; then echo "::error::v15 不该包含 PakEngine.swift（改字引擎）"; exit 1; fi
          if [ -d Sources/Kernel ]; then echo "::error::v15 不该包含 Sources/Kernel（内核）"; exit 1; fi
          echo "干净 ✅"

          echo "---- 包标识必须是 v15 自己的 ----"
          grep -q "com.langshen.zakamove15" project.yml || { echo "::error::包标识不是 v15 的，会和旧版打架"; exit 1; }
          echo "标识 ✅"

          echo "---- 明文 http 必须放行 ----"
          grep -q "NSAllowsArbitraryLoads" project.yml || { echo "::error::没放行明文 http，连不上本机服务"; exit 1; }
          grep -q "NSLocalNetworkUsageDescription" project.yml || { echo "::error::没写本地网络用途说明"; exit 1; }

          echo "---- 必须是修过编译错误的源码 ----"
          grep -q "struct BridgeFailure: Error" Sources/FilzaBridge.swift || { echo "::error::这是修复前的旧源码（Result 失败类型没改）。换成 v15.3 的 zip 再跑"; exit 1; }
          grep -q "Self.commonPorts" Sources/FilzaBridge.swift || { echo "::error::这是修复前的旧源码（静态成员用法没改）。换成 v15.3 的 zip 再跑"; exit 1; }
          if grep -q "waitsForConnectivity = false" Sources/FilzaBridge.swift; then echo "::error::这是修复前的旧源码（给只读属性赋值）。换成 v15.3 的 zip 再跑"; exit 1; fi
          echo "编译修复 ✅"
          echo "网络权限 ✅"

          xcodegen generate
          ls -la
          xcodebuild -list -project LSPakManager.xcodeproj

      - name: 6 编译
        env:
          SRC_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          cd "$SRC_ROOT"
          set +e
          xcodebuild \
            -project LSPakManager.xcodeproj \
            -scheme LSPakManager \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build > /tmp/build.log 2>&1
          RC=$?
          echo "xcodebuild 退出码 = $RC"
          echo "=================================================="
          echo "真正的报错（error: 开头的行）"
          echo "=================================================="
          grep -nE "error:|fatal error|BUILD FAILED|The following build commands failed|undefined symbol|ld: " /tmp/build.log | head -60 || echo "（没匹配到 error: 行）"
          echo "=================================================="
          echo "日志最后 40 行"
          echo "=================================================="
          tail -n 40 /tmp/build.log || true
          if [ "$RC" -ne 0 ]; then
            {
              echo ""
              echo "## ❌ 编译失败，原文在这（版本 15.1）"
              echo ""
              echo "下面是编译器原话，带文件名和行号，直接截这一块发过来就行。"
              echo ""
              echo '```'
              grep -nE "error:|fatal error" /tmp/build.log | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          n=0
          grep -E "error:|fatal error" /tmp/build.log | head -8 | while IFS= read -r line; do
            n=$((n+1))
            [ "$n" -gt 5 ] && break
            safe=$(printf '%s' "$line" | sed 's/%/%25/g')
            echo "::error::编译报错 → $safe"
          done
          exit $RC

      - name: 7 打包成 ipa
        id: pack
        env:
          SRC_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -eu
          cd "$SRC_ROOT"
          APP=$(find build/Build/Products -maxdepth 3 -type d -name "*.app" | head -n 1 || true)
          echo "APP = [$APP]"
          if [ -z "$APP" ]; then
            echo "::error::没找到 .app"
            find build -maxdepth 4 -type d | head -n 40 || true
            exit 1
          fi
          APPNAME=$(basename "$APP")
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || true)
          [ -n "${EXEC:-}" ] || EXEC="${APPNAME%.app}"
          echo "APPNAME = [$APPNAME]  主程序 = [$EXEC]"

          rm -rf Payload LSPakManager-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" "Payload/$APPNAME"
          lipo -info "Payload/$APPNAME/$EXEC" 2>/dev/null || file "Payload/$APPNAME/$EXEC"

          if zip -qry LSPakManager-unsigned.ipa Payload; then
            echo "打包方式：zip ✅"
          else
            rm -f LSPakManager-unsigned.ipa
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload LSPakManager-unsigned.ipa
            echo "打包方式：ditto ✅"
          fi

          ls -l LSPakManager-unsigned.ipa
          SIZE=$(stat -f%z LSPakManager-unsigned.ipa)
          if [ "$SIZE" -lt 300000 ]; then
            echo "::error::ipa 只有 $SIZE 字节，明显不对"
            exit 1
          fi
          unzip -t LSPakManager-unsigned.ipa | tail -n 4

          LISTING=$(unzip -l LSPakManager-unsigned.ipa)
          printf '%s\n' "$LISTING" | grep -q "Payload/$APPNAME/Info.plist" || { echo "::error::结构错：没有 Info.plist"; exit 1; }
          printf '%s\n' "$LISTING" | grep -q "Payload/$APPNAME/$EXEC"     || { echo "::error::结构错：没有主程序"; exit 1; }
          echo "✅ ipa 结构正确"

          SHA=$(shasum -a 256 LSPakManager-unsigned.ipa | awk '{print $1}')
          printf '%s  LSPakManager-unsigned.ipa\n' "$SHA" > LSPakManager-ipa.sha256
          {
            echo "sha=$SHA"
            echo "size=$SIZE"
            echo "appname=$APPNAME"
            echo "exec=$EXEC"
          } >> "$GITHUB_OUTPUT"

      - name: 8 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LSPakManager-ipa-v15
          path: |
            ${{ steps.locate.outputs.root }}/LSPakManager-unsigned.ipa
            ${{ steps.locate.outputs.root }}/LSPakManager-ipa.sha256
          retention-days: 30

      - name: 发布成可直接下载的 ipa 链接
        id: rel
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-latest
          name: 最新 ipa（自动构建）
          body: |
            构建号：${{ github.run_number }}
            版本：15.1（一个中转站，自动进出 · 修掉三处编译错误）
            SHA256：${{ steps.pack.outputs.sha }}

            未签名包，导入全能签/3095 后勾「重签所有框架」再签。
          files: |
            ${{ steps.locate.outputs.root }}/LSPakManager-unsigned.ipa
          overwrite_files: true
          make_latest: true

      - name: 9 运行页写出直链
        if: success()
        run: |
          set +e
          URL="https://github.com/${{ github.repository }}/releases/download/ipa-latest/LSPakManager-unsigned.ipa"
          AURL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ✅ ipa 直链（点开直接下真 ipa）"
            echo ""
            echo "$URL"
            echo ""
            echo "- 版本：15.1"
            echo "- 大小：${{ steps.pack.outputs.size }} 字节"
            echo "- SHA256：\`${{ steps.pack.outputs.sha }}\`"
            echo ""
            echo "## 📦 Artifacts 备用（这个是 zip，要先解压）"
            echo ""
            echo "$AURL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ipa 直链 = $URL"

      - name: 10 失败时把错误原文写回仓库
        if: failure()
        env:
          SRC_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set +e
          {
            echo "# 编译错误原文（v15.1）"
            echo ""
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ -f /tmp/build.log ]; then
              echo "## 一、error 行"
              echo '```'
              grep -nE "error:|fatal error|BUILD FAILED|The following build commands failed|undefined symbol|ld: |clang: error" /tmp/build.log | head -200
              echo '```'
              echo ""
              echo "## 二、日志最后 150 行"
              echo '```'
              tail -n 150 /tmp/build.log
              echo '```'
            else
              echo "没跑到编译就停了（多半是没找到 v15 源码）。"
            fi
          } > BUILD-ERROR.txt
          sed -n '1,30p' BUILD-ERROR.txt
          git config user.name "zaka-build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -f BUILD-ERROR.txt
          git commit -m "记录编译错误 [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::写回仓库失败"
